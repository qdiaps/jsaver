services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: jsaver-telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "${TELEGRAM_BOT_API_PORT:-8081}:8081"
    networks:
      - jsaver-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jsaver-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081/bot
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - jsaver-net

volumes:
  telegram-bot-api-data:
    driver: local

networks:
  jsaver-net:
    driver: bridge
